    <title>Panduan Mengurangi Garam</title>

<body>

    <h1>Panduan Mengurangi Garam</h1>

    <p>
        Untuk mengurangi penggunaan garam pada setiap resep,
        kurangi garam sebanyak 1 sendok teh dari takaran yang digunakan.
    </p>

    <p>
        Pengurangan garam ini dapat diterapkan pada setiap resep
        yang terdapat dalam Buku Resep Aceh.
    </p>
